<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heartopia 攻略站 ✿</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Pacifico&display=swap" rel="stylesheet">
<style>
  :root {
    --rose: #f9a8d4;
    --rose-deep: #ec4899;
    --peach: #fcd5b0;
    --mint: #a7f3d0;
    --mint-deep: #34d399;
    --sky: #bae6fd;
    --sky-deep: #38bdf8;
    --lavender: #ddd6fe;
    --yellow: #fef08a;
    --cream: #fff8f0;
    --text: #4a3728;
    --text-soft: #9d7b6a;
    --white: #ffffff;
    --card-shadow: 0 8px 32px rgba(236,72,153,0.10);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--cream);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Decorative background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 10% 20%, #fce7f388 0%, transparent 40%),
      radial-gradient(circle at 90% 10%, #bae6fd66 0%, transparent 35%),
      radial-gradient(circle at 80% 80%, #a7f3d066 0%, transparent 40%),
      radial-gradient(circle at 20% 85%, #ddd6fe55 0%, transparent 35%);
    pointer-events: none;
    z-index: 0;
  }

  /* Floating hearts */
  .hearts-bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .heart-float {
    position: absolute;
    font-size: 1.2rem;
    opacity: 0.12;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
    10% { opacity: 0.12; }
    90% { opacity: 0.12; }
    100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
  }

  /* Header */
  header {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 3rem 1rem 2rem;
  }
  .site-title {
    font-family: 'Pacifico', cursive;
    font-size: clamp(2.2rem, 6vw, 3.8rem);
    background: linear-gradient(135deg, var(--rose-deep), #a855f7, var(--sky-deep));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 2px 8px rgba(236,72,153,0.25));
    animation: fadeDown 0.8s ease both;
  }
  .site-subtitle {
    margin-top: 0.5rem;
    font-size: 1rem;
    color: var(--text-soft);
    font-weight: 600;
    letter-spacing: 0.05em;
    animation: fadeDown 0.8s 0.15s ease both;
    opacity: 0;
  }
  .header-deco {
    display: flex;
    justify-content: center;
    gap: 0.5rem;
    margin-top: 0.8rem;
    font-size: 1.4rem;
    animation: fadeDown 0.8s 0.3s ease both;
    opacity: 0;
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-18px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Nav tabs */
  nav {
    position: relative;
    z-index: 10;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 0.6rem;
    padding: 0 1rem 1.5rem;
    animation: fadeDown 0.8s 0.4s ease both;
    opacity: 0;
  }
  .nav-btn {
    background: white;
    border: 2.5px solid transparent;
    border-radius: 999px;
    padding: 0.45rem 1.2rem;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 0.88rem;
    color: var(--text-soft);
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 3px 12px rgba(0,0,0,0.07);
  }
  .nav-btn:hover, .nav-btn.active {
    background: linear-gradient(135deg, var(--rose), #c084fc);
    color: white;
    border-color: transparent;
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(236,72,153,0.3);
  }

  /* Main content */
  main {
    position: relative;
    z-index: 10;
    max-width: 900px;
    margin: 0 auto;
    padding: 0 1rem 4rem;
  }

  /* Section header */
  .section-header {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    margin-bottom: 1.5rem;
  }
  .section-icon {
    width: 42px; height: 42px;
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.3rem;
    flex-shrink: 0;
  }
  .section-title {
    font-size: 1.3rem;
    font-weight: 900;
    color: var(--text);
  }
  .section-title span {
    font-weight: 600;
    font-size: 0.9rem;
    color: var(--text-soft);
    margin-left: 0.5rem;
  }

  /* Quest cards grid */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 1.2rem;
    margin-bottom: 2.5rem;
  }

  .quest-card {
    background: white;
    border-radius: 20px;
    padding: 1.4rem;
    box-shadow: var(--card-shadow);
    cursor: pointer;
    transition: all 0.25s cubic-bezier(.34,1.56,.64,1);
    border: 2px solid transparent;
    animation: fadeUp 0.5s ease both;
    position: relative;
    overflow: hidden;
  }
  .quest-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    border-radius: 20px 20px 0 0;
  }
  .quest-card.rose::before { background: linear-gradient(90deg, var(--rose), var(--rose-deep)); }
  .quest-card.mint::before { background: linear-gradient(90deg, var(--mint), var(--mint-deep)); }
  .quest-card.sky::before { background: linear-gradient(90deg, var(--sky), var(--sky-deep)); }
  .quest-card.lavender::before { background: linear-gradient(90deg, var(--lavender), #a855f7); }
  .quest-card.yellow::before { background: linear-gradient(90deg, var(--yellow), #f59e0b); }

  .quest-card:hover {
    transform: translateY(-6px) scale(1.02);
    box-shadow: 0 16px 48px rgba(236,72,153,0.18);
    border-color: var(--rose);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card-emoji { font-size: 2rem; margin-bottom: 0.7rem; }
  .card-tag {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 800;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 0.2rem 0.6rem;
    border-radius: 999px;
    margin-bottom: 0.5rem;
  }
  .tag-rose { background: #fce7f3; color: #be185d; }
  .tag-mint { background: #d1fae5; color: #065f46; }
  .tag-sky { background: #e0f2fe; color: #0369a1; }
  .tag-lavender { background: #ede9fe; color: #6d28d9; }
  .tag-yellow { background: #fef9c3; color: #854d0e; }

  .card-title {
    font-size: 1rem;
    font-weight: 800;
    color: var(--text);
    margin-bottom: 0.4rem;
    line-height: 1.3;
  }
  .card-desc {
    font-size: 0.82rem;
    color: var(--text-soft);
    line-height: 1.5;
  }
  .card-meta {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    margin-top: 0.8rem;
    padding-top: 0.8rem;
    border-top: 1.5px dashed #f3e8ff;
  }
  .card-diff {
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--text-soft);
  }
  .stars { color: #f59e0b; font-size: 0.8rem; letter-spacing: -1px; }
  .card-arrow {
    margin-left: auto;
    font-size: 0.9rem;
    color: var(--rose-deep);
    transition: transform 0.2s;
  }
  .quest-card:hover .card-arrow { transform: translateX(4px); }

  /* Tip box */
  .tip-box {
    background: white;
    border-radius: 20px;
    padding: 1.5rem 1.6rem;
    margin-bottom: 2.5rem;
    box-shadow: var(--card-shadow);
    border-left: 5px solid var(--mint-deep);
    display: flex;
    gap: 1rem;
    align-items: flex-start;
    animation: fadeUp 0.5s 0.3s ease both;
    opacity: 0;
  }
  .tip-icon { font-size: 1.8rem; flex-shrink: 0; }
  .tip-title { font-weight: 800; font-size: 1rem; color: #065f46; margin-bottom: 0.3rem; }
  .tip-text { font-size: 0.88rem; color: var(--text-soft); line-height: 1.6; }

  /* Detail panel */
  .detail-panel {
    display: none;
    background: white;
    border-radius: 24px;
    padding: 2rem;
    margin-bottom: 2rem;
    box-shadow: 0 12px 48px rgba(236,72,153,0.15);
    animation: fadeUp 0.3s ease both;
    border: 2px solid #fce7f3;
  }
  .detail-panel.open { display: block; }
  .detail-header {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 1.5rem;
  }
  .detail-emoji { font-size: 2.5rem; }
  .detail-title { font-size: 1.4rem; font-weight: 900; }
  .detail-close {
    margin-left: auto;
    background: #fce7f3;
    border: none;
    border-radius: 999px;
    width: 36px; height: 36px;
    font-size: 1.1rem;
    cursor: pointer;
    color: var(--rose-deep);
    font-weight: 900;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .detail-close:hover { background: var(--rose-deep); color: white; }

  .steps-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 0.8rem;
  }
  .steps-list li {
    display: flex;
    gap: 1rem;
    align-items: flex-start;
    background: var(--cream);
    border-radius: 14px;
    padding: 0.9rem 1rem;
  }
  .step-num {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--rose), #c084fc);
    color: white;
    font-weight: 900;
    font-size: 0.85rem;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .step-text { font-size: 0.9rem; line-height: 1.55; color: var(--text); padding-top: 0.2rem; }

  .reward-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
    margin-top: 1.2rem;
    padding-top: 1.2rem;
    border-top: 2px dashed #fce7f3;
  }
  .reward-chip {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    background: #fef9c3;
    border-radius: 999px;
    padding: 0.3rem 0.8rem;
    font-size: 0.82rem;
    font-weight: 700;
    color: #854d0e;
  }

  /* Footer */
  footer {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 2rem 1rem;
    color: var(--text-soft);
    font-size: 0.85rem;
    font-weight: 600;
  }

  /* Responsive */
  @media (max-width: 500px) {
    .cards-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- Floating hearts background -->
<div class="hearts-bg" id="heartsBg"></div>

<!-- Header -->
<header>
  <div class="site-title">Heartopia 攻略站</div>

  <div class="header-deco">🌸 🏡 🎣 🌿 🐾 🍳</div>
</header>

<!-- Nav -->
<nav>

  <button class="nav-btn" onclick="filterCards('daily', this)">📅 每日任务</button>
</nav>

<!-- Main -->
<main>

  <!-- Detail Panel (hidden by default) -->
  <div class="detail-panel" id="detailPanel">
    <div class="detail-header">
      <div class="detail-emoji" id="detailEmoji"></div>
      <div>
        <div class="detail-title" id="detailTitle"></div>
        <div class="card-desc" id="detailDesc"></div>
      </div>
      <button class="detail-close" onclick="closeDetail()">✕</button>
    </div>
    <ul class="steps-list" id="detailSteps"></ul>
    <div class="reward-row" id="detailRewards"></div>
  </div>

  <!-- Tip box -->
  <div class="tip-box">
    <div class="tip-icon">💡</div>

      <div class="tip-title">新手小提示</div>
      <div class="tip-text">Heartopia 是一款休闲生活模拟游戏，不需要赶进度！每天完成日常任务可以积累货币，先以解锁钓鱼和烹饪为目标，这两个系统奖励最丰厚 🎣🍳</div>
    </div>
  </div>

  <!-- Cards -->
  <div class="section-header">
    <div class="section-icon" style="background:#fce7f3;">🌟</div>
    <div class="section-title">攻略列表 <span id="cardCount"></span></div>
  </div>

  <div class="cards-grid" id="cardsGrid">
    <!-- Cards injected by JS -->
  </div>

</main>

<footer>
  🌸 Heartopia 攻略站 · 非官方粉丝站 · 内容持续更新中
</footer>

  h.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
  h.style.left = Math.random() * 100 + '%';
  h.style.animationDuration = (12 + Math.random() * 16) + 's';
  h.style.animationDelay = (Math.random() * 15) + 's';
  h.style.fontSize = (0.8 + Math.random() * 3.5) + 'rem';

  heartsBg.appendChild(h);
}

let currentFilter = 'all';
let currentDetail = null;

function renderCards(filter) {
  const grid = document.getElementById('cardsGrid');
  const filtered = filter === 'all' ? quests : quests.filter(q => q.category === filter);
  document.getElementById('cardCount').textContent = filtered.length + ' 篇攻略';
  grid.innerHTML = '';
  filtered.forEach((q, i) => {
    const stars = '★'.repeat(q.diff) + '☆'.repeat(3 - q.diff);
    const diffLabel = ['', '简单', '普通', '稍难'][q.diff];
    const card = document.createElement('div');
    card.className = `quest-card ${q.color}`;
    card.style.animationDelay = (i * 0.07) + 's';
    card.innerHTML = `
      <div class="card-emoji">${q.emoji}</div>
      <div class="card-tag ${q.tagClass}">${q.tag}</div>
      <div class="card-title">${q.title}</div>
      <div class="card-desc">${q.desc}</div>
      <div class="card-meta">
        <span class="card-diff">${diffLabel}</span>
        <span class="stars">${stars}</span>
        <span class="card-arrow">→</span>
      </div>
    `;
    card.onclick = () => openDetail(q);
    grid.appendChild(card);
  });
}

function filterCards(category, btn) {
  currentFilter = category;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  closeDetail();
  renderCards(category);
}

function openDetail(quest) {
  currentDetail = quest;
  document.getElementById('detailEmoji').textContent = quest.emoji;
  document.getElementById('detailTitle').textContent = quest.title;
  document.getElementById('detailDesc').textContent = quest.desc;

  const stepsList = document.getElementById('detailSteps');
  stepsList.innerHTML = quest.steps.map((s, i) =>
    `<li><div class="step-num">${i+1}</div><div class="step-text">${s}</div></li>`
  ).join('');

  const rewardRow = document.getElementById('detailRewards');
  rewardRow.innerHTML = '<strong style="font-size:.85rem;color:var(--text-soft);width:100%;display:block;margin-bottom:.4rem;">🎁 任务奖励</strong>'
    + quest.rewards.map(r => `<span class="reward-chip">${r}</span>`).join('');

  const panel = document.getElementById('detailPanel');
  panel.classList.add('open');
  panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function closeDetail() {
  document.getElementById('detailPanel').classList.remove('open');
  currentDetail = null;
}

// Init
renderCards('all');
</script>
</body>
</html>
